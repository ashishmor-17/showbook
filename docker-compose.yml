services:
  postgres:
    image: postgres:16-alpine
    container_name: showbook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  redis:
    image: redis:7-alpine
    container_name: showbook-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.15
    container_name: showbook-mailpit
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: showbook-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalog-service:
    build:
      context: .
      dockerfile: apps/catalog-service/Dockerfile
    container_name: showbook-catalog-service
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://showbook:showbook@postgres:5432/showbook_catalog
      - TESTING=false
      - LOG_LEVEL=INFO
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - VENUE_SERVICE_URL=http://venue-service:8001
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./apps/catalog-service/app:/app/apps/catalog-service/app
      - ./packages/python/showbook_common:/app/packages/python/showbook_common
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 5s
      retries: 2

  venue-service:
    build:
      context: .
      dockerfile: apps/venue-service/Dockerfile
    container_name: showbook-venue-service
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://showbook:showbook@postgres:5432/showbook_catalog
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - INVENTORY_SERVICE_URL=http://inventory-service:8003
      - TESTING=false
      - LOG_LEVEL=INFO
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8001"
    volumes:
      - ./apps/venue-service/app:/app/apps/venue-service/app
      - ./packages/python/showbook_common:/app/packages/python/showbook_common
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready')"]
      interval: 5s
      timeout: 5s
      retries: 2

  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
    container_name: showbook-user-service
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql+asyncpg://showbook:showbook@postgres:5432/showbook_user
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - ACCESS_TOKEN_EXPIRY=${ACCESS_TOKEN_EXPIRY}
      - REFRESH_TOKEN_EXPIRY=${REFRESH_TOKEN_EXPIRY}
      - TESTING=false
      - LOG_LEVEL=INFO
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_FROM=noreply@showbook.com
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8002"
    volumes:
      - ./apps/user-service/app:/app/apps/user-service/app
      - ./packages/python/showbook_common:/app/packages/python/showbook_common
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 5s
      timeout: 5s
      retries: 2

  inventory-service:
    build:
      context: .
      dockerfile: apps/inventory-service/Dockerfile
    container_name: showbook-inventory-service
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://showbook:showbook@postgres:5432/showbook_inventory
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - LOG_LEVEL=INFO
      - PORT=8003
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8003/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 2

  booking-service:
    build:
      context: .
      dockerfile: apps/booking-service/Dockerfile
    container_name: showbook-booking-service
    ports:
      - "8006:8006"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_DEFAULT_VHOST}
      - DATABASE_URL=postgresql://showbook:showbook@postgres:5432/showbook_booking
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST}
      - VENUE_SERVICE_URL=http://venue-service:8001
      - INVENTORY_SERVICE_URL=http://inventory-service:8003
      - CATALOG_SERVICE_URL=http://catalog-service:8000
      - USER_SERVICE_URL=http://user-service:8002
      - LOG_LEVEL=INFO
      - PORT=8006
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      venue-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8006/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 2

  payment-service:
    build:
      context: .
      dockerfile: apps/payment-service/Dockerfile
    container_name: showbook-payment-service
    ports:
      - "8007:8007"
    environment:
      - DATABASE_URL=postgresql+asyncpg://showbook:showbook@postgres:5432/showbook_booking
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST}
      - PAYMENT_SERVICE_URL=http://localhost:8007
      - GATEWAY_SECRET=payment_gateway_secret_key
      - USER_SERVICE_URL=http://user-service:8002
      - TESTING=false
      - LOG_LEVEL=INFO
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8007"
    volumes:
      - ./apps/payment-service/app:/app/apps/payment-service/app
      - ./apps/payment-service/migrations:/app/apps/payment-service/migrations
      - ./packages/python/showbook_common:/app/packages/python/showbook_common
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health')"]
      interval: 5s
      timeout: 5s
      retries: 2

  notification-service:
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    container_name: showbook-notification-service
    ports:
      - "8008:8008"
    environment:
      - DATABASE_URL=postgresql+asyncpg://showbook:showbook@postgres:5432/showbook_notification
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST}
      - USER_SERVICE_URL=http://user-service:8002
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_SENDER=noreply@showbook.com
      - TESTING=false
      - LOG_LEVEL=INFO
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8008"
    volumes:
      - ./apps/notification-service/app:/app/apps/notification-service/app
      - ./apps/notification-service/migrations:/app/apps/notification-service/migrations
      - ./packages/python/showbook_common:/app/packages/python/showbook_common
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health')"]
      interval: 5s
      timeout: 5s
      retries: 2

  api-gateway:
    image: nginx:1.25-alpine
    container_name: showbook-api-gateway
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/snippets:/etc/nginx/snippets:ro
      - ./infrastructure/nginx/upstreams:/etc/nginx/upstreams:ro
    depends_on:
      catalog-service:
        condition: service_healthy
      venue-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - default

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: showbook-web
    ports:
      - "3000:3000"
    environment:
      - GATEWAY_URL=http://api-gateway
      - NEXT_TELEMETRY_DISABLED=1
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
