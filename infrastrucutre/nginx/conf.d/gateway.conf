server {
    listen 80;
    server_name localhost;

    include /etc/nginx/snippets/proxy.conf;
    
    # Strip headers globally
    proxy_set_header X-Internal-Service "";

    # Load gateway health check
    include /etc/nginx/snippets/health.conf;

    location ~* /api/internal/ {
        return 403;
    }

    # Public routes with CORS enabled
    location /auth/ {
        include /etc/nginx/snippets/cors.conf;
        proxy_pass http://user_service/;
    }

    location /users/ {
        include /etc/nginx/snippets/cors.conf;
        proxy_pass http://user_service/;
    }

    location /catalog/ {
        include /etc/nginx/snippets/cors.conf;
        proxy_pass http://catalog_service/;
    }

    location /venues/ {
        include /etc/nginx/snippets/cors.conf;
        proxy_pass http://venue_service/;
    }

    location /inventory/ {
        include /etc/nginx/snippets/cors.conf;
        proxy_pass http://inventory_service/;
    }

    location /bookings/ {
        include /etc/nginx/snippets/cors.conf;
        proxy_pass http://booking_service/;
    }

    location /payments/ {
        include /etc/nginx/snippets/cors.conf;
        proxy_pass http://payment_service/;
    }

    location /notifications/ {
        include /etc/nginx/snippets/cors.conf;
        proxy_pass http://notification_service/;
    }
}
