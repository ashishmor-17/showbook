[project]
name = "showbook"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy[asyncio]==2.0.32",
    "asyncpg==0.29.0",
    "alembic==1.13.2",
    "pydantic==2.8.2",
    "pydantic-settings==2.4.0",
    "email-validator>=2.2.0",
    "python-jose==3.3.0",
    "bcrypt==4.0.1",
    "passlib==1.7.4",
    "redis==5.0.8",
    "celery==5.4.0",
    "httpx==0.27.0",
    "pytest==8.3.2",
    "pytest-asyncio>=1.3.0",
    "boto3>=1.34.0",
    "python-multipart>=0.0.9",
    "python-magic>=0.4.27",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "pypdf>=4.0.0",
    "Pillow>=10.0.0",
    "structlog",
